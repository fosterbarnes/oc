name: Bug report
description: Report an issue that should be fixed (avoid pasting giant AI generated summaries or your issue may be closed/ignored)
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug you encountered
      placeholder: What happened?
    validations:
      required: true

  - type: input
    id: plugins
    attributes:
      label: Plugins
      description: What plugins are you using?
    validations:
      required: false

  - type: input
    id: oc-version
    attributes:
      label: oc version
      description: Shown in the sidebar footer as `oc vX ∙ OG vY`
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: Model
      description: Which provider and model, for example claude-code/opus or cursor/grok
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: screenshot-or-link
    attributes:
      label: Screenshot or log
      description: Attach a screenshot, or the relevant lines from %USERPROFILE%\.local\share\opencode\log\opencode.log
      placeholder: Drag and drop a screenshot or paste log lines here
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: what OS are you using?
      placeholder: e.g., Windows 11 24H2, Windows 10 22H2
    validations:
      required: false

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: what terminal are you using?
      placeholder: e.g., WezTerm, Windows Terminal, conhost
    validations:
      required: false
