name: generate

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: generated ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [client, sdk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Check generated client
        if: matrix.target == 'client'
        working-directory: packages/client
        run: bun run check:generated

      - name: Regenerate legacy SDK and OpenAPI
        if: matrix.target == 'sdk'
        run: |
          bun packages/sdk/js/script/build.ts
          bun run --cwd packages/opencode dev generate > packages/sdk/openapi.json
          bun prettier --write packages/sdk/openapi.json

      - name: Check generated files
        run: |
          git diff --exit-code -- packages/client/src/generated packages/client/src/generated-effect packages/sdk
          test -z "$(git ls-files --others --exclude-standard -- packages/client/src/generated packages/client/src/generated-effect packages/sdk)"
