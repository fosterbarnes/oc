name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: ${{ matrix.package }} (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package:
          - cli
          - client
          - codemode
          - console/app
          - console/core
          - console/function
          - core
          - effect-drizzle-sqlite
          - function
          - http-recorder
          - httpapi-codegen
          - llm
          - opencode
          - protocol
          - schema
          - sdk/js
          - session-ui
          - stats/core
          - tui
          - ui
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run unit tests
        working-directory: src/packages/${{ matrix.package }}
        run: bun test --timeout 30000 --only-failures
        env:
          GITHUB_ACTIONS: "false"
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

  providers:
    name: ${{ matrix.package }} (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [agentify-runtime, cursor-runtime]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Run provider tests
        working-directory: src/packages/${{ matrix.package }}
        run: bun run test

  httpapi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Run HttpApi exerciser gates
        working-directory: src/packages/opencode
        run: bun run test:httpapi
